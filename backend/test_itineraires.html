<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test itinéraires</title>
</head>
<body>
    <h1>Test itinéraires</h1>

    <button onclick="login()">Connexion</button>
    <button onclick="createItineraire()">Créer itinéraire</button>
    <button onclick="getMine()">Voir mes itinéraires</button>
    <button onclick="updateItineraire()">Modifier dernier itinéraire</button>
    <button onclick="addActivite()">Ajouter activité</button>
    <button onclick="removeActivite()">Retirer activité</button>

    <pre id="result"></pre>

    <script>
        let itineraireId = null;

        const destinationId = 3;
        const transportId = 2;
        const hebergementId = 1;
        const activiteId = 2;

        function show(data) {
            document.getElementById("result").textContent =
                typeof data === "string" ? data : JSON.stringify(data, null, 2);
        }

        function login() {
            fetch("./auth/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    email: "hugo@test.com",
                    password: "123456"
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }

        function createItineraire() {
            fetch("./itineraires/create.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    destination_id: destinationId,
                    transport_id: transportId,
                    hebergement_id: hebergementId,
                    date_debut: "2026-07-15",
                    date_fin: "2026-07-20"
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.itineraire_id) {
                    itineraireId = data.itineraire_id;
                }
                show(data);
            })
            .catch(error => show({ error: error.toString() }));
        }

        function getMine() {
            fetch("./itineraires/getMine.php", {
                method: "GET",
                credentials: "include"
            })
            .then(response => response.json())
            .then(data => {
                if (!itineraireId && data.itineraires && data.itineraires.length > 0) {
                    itineraireId = data.itineraires[0].id;
                }
                show(data);
            })
            .catch(error => show({ error: error.toString() }));
        }

        function updateItineraire() {
            if (!itineraireId) {
                show({ error: "Crée ou récupère d'abord un itinéraire" });
                return;
            }

            fetch("./itineraires/update.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    id: itineraireId,
                    destination_id: destinationId,
                    transport_id: transportId,
                    hebergement_id: hebergementId,
                    date_debut: "2026-07-16",
                    date_fin: "2026-07-21"
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }

        function addActivite() {
            if (!itineraireId) {
                show({ error: "Crée ou récupère d'abord un itinéraire" });
                return;
            }

            fetch("./itineraires/addActivite.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    itineraire_id: itineraireId,
                    activite_id: activiteId
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }

        function removeActivite() {
            if (!itineraireId) {
                show({ error: "Crée ou récupère d'abord un itinéraire" });
                return;
            }

            fetch("./itineraires/removeActivite.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    itineraire_id: itineraireId,
                    activite_id: activiteId
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }
    </script>
</body>
</html>
