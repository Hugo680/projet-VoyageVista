<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test suppression hébergement</title>
</head>
<body>
    <h1>Test suppression hébergement</h1>

    <button onclick="login()">Connexion admin</button>
    <button onclick="deleteHebergement()">Supprimer hébergement</button>

    <pre id="result"></pre>

    <script>
        function show(data) {
            document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        }

        function login() {
            fetch("./auth/login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    email: "hugo@test.com",
                    password: "123456"
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }

        function deleteHebergement() {
            fetch("./hebergements/delete.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    id: 2
                })
            })
            .then(response => response.json())
            .then(show)
            .catch(error => show({ error: error.toString() }));
        }
    </script>
</body>
</html>
